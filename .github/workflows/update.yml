name: Update VOD Data

on:
  schedule:
    # 每 6 小时跑一次（UTC）
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Crawl
        # --split 必须保留：Worker 的 /fdzys、/jsard 等路径依赖 vod-<源>.json
        run: python crawler_v2.py --pages 5 --limit 45 --split

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod.json vod-*.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Auto update VOD data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
