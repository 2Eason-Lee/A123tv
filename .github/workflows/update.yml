name: Update VOD Data

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时自动运行一次
  workflow_dispatch: # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 运行 A123TV 采集脚本
      - name: Run python crawler.py
        run: python crawler.py

      # 运行 555电影 采集脚本
      - name: Run python crawler_555.py
        run: python crawler_555.py

      # 统一提交两个 JSON 文件
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add vod.json dy555.json
          git commit -m "Auto update vod.json and dy555.json data" || exit 0
          git push
