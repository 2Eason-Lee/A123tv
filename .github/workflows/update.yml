name: Update VOD Data
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 4K影视的播放地址要用站点官方 WASM 签名（sources/kvm_sign.mjs）。
      # 没有 deno（跑在 node 上也行）时 kvm 源拿不到地址，整块数据会空。
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install requests
      - run: python crawler_v2.py --pages 2 --limit 25 --split
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-*.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "update $(date -u +%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" && git push; then
              exit 0
            fi
            echo "retry $i"; sleep 5
          done
          exit 1
