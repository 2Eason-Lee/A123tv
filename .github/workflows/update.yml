name: Update VOD Data
on:
  schedule:
    # 每 6 小时跑一次（UTC）
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Crawl
        run: python crawler_v2.py --pages 10 --limit 60 --split
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vod-*.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "Auto update VOD data ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" && git push; then
              exit 0
            fi
            echo "push 被拒，第 $i 次重试"
            sleep 5
          done
          echo "推送失败：远端在抓取期间被改动过，请重跑一次 Action"
          exit 1
